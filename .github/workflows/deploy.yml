name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by ingest.yml after it commits a snapshot.
  #
  # This is not a convenience — it is the only thing that makes the deploy fire
  # at all for a data commit. GitHub deliberately does NOT trigger `on: push`
  # workflows for pushes made with the default GITHUB_TOKEN, to stop workflows
  # retriggering themselves. So the ingest job pushed 54 snapshots to main over a
  # week and the site stayed frozen on the last human merge, serving week-old
  # numbers while fresh ones sat in the repo behind it.
  #
  # workflow_call sidesteps it without a personal access token: ingest.yml
  # explicitly calls this workflow, so no push trigger is involved.
  workflow_call:

concurrency:
  group: pages
  # Only the newest snapshot matters; cancel a deploy that a fresher one supersedes.
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level, not step-level: the build and the verifier must agree on the
    # base, or the verifier checks a /<repo>/ build against "/" and fails every
    # assertion. Setting it on the build step alone did exactly that.
    env:
      # GitHub Pages serves a project site from /<repo>/. Deriving it from the
      # repository name means a fork or a rename needs no edit here. Set this
      # to "/" when serving from a custom domain or a <user>.github.io repo.
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the build is deployable
        run: node scripts/verify-build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
