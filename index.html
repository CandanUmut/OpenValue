<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what lets env(safe-area-inset-*) return non-zero,
         which the black-translucent status bar below makes mandatory. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Value — Markets Overview</title>
    <meta name="description" content="Currencies, metals, crypto and markets at a glance. Delayed data, no accounts." />

    <meta name="theme-color" content="#0B0D10" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores the manifest for install metadata and needs all of these. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Value" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <!-- The font blocks first paint of every number in the app, so it is the one
         resource worth preloading. crossorigin is required even same-origin: a
         font request is always CORS, and without it the preload is discarded and
         fetched twice. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">
        Value needs JavaScript to render charts and conversions. The underlying
        data is plain JSON and can be read directly at
        <a href="%BASE_URL%data/latest.json">data/latest.json</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
